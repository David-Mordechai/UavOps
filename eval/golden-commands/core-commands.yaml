# Golden set for tests/UavOps.Agent.Evals. Each case is one operator utterance sent through the
# real, live chat pipeline. "argsContain" values are exact substrings looked for in the logged
# JSON args of the matching tool call — written as the precise "key":value (or "key":"value")
# pair rather than a bare number, so e.g. an expected 200 can't accidentally match inside 32000.

- name: navigate
  utterance: "Fly UAV-1 to target alpha"
  expectedTools:
    - agent: FlightControlAgent
      tool: NavigateTo
      argsContain:
        tailNumber: '"tailNumber":"UAV-1"'
        location: '"location":"target alpha"'

- name: set-speed
  utterance: "Set UAV-1 speed to 220 knots"
  expectedTools:
    - agent: FlightControlAgent
      tool: SetSpeed
      argsContain:
        tailNumber: '"tailNumber":"UAV-1"'
        speedKts: '"speedKts":220'

- name: set-altitude
  utterance: "Set UAV-1 altitude to 3000 feet"
  expectedTools:
    - agent: FlightControlAgent
      tool: SetAltitude
      argsContain:
        tailNumber: '"tailNumber":"UAV-1"'
        altitudeFt: '"altitudeFt":3000'

- name: return-to-launch
  utterance: "Return UAV-2 to launch"
  expectedTools:
    - agent: FlightControlAgent
      tool: ReturnToLaunch
      argsContain:
        tailNumber: '"tailNumber":"UAV-2"'

- name: get-telemetry
  utterance: "What is the current telemetry for UAV-1?"
  expectedTools:
    - agent: FlightControlAgent
      tool: GetTelemetry
      argsContain:
        tailNumber: '"tailNumber":"UAV-1"'

- name: list-uavs
  utterance: "List all the UAVs in the fleet"
  expectedTools:
    - agent: FlightControlAgent
      tool: ListUavs
      argsContain: {}

- name: point-payload
  utterance: "Point UAV-1's camera at target bravo"
  expectedTools:
    - agent: PayloadControlAgent
      tool: PointPayload
      argsContain:
        tailNumber: '"tailNumber":"UAV-1"'
        location: '"location":"target bravo"'

- name: reset-payload
  utterance: "Reset UAV-1's payload to its default position"
  expectedTools:
    - agent: PayloadControlAgent
      tool: ResetPayload
      argsContain:
        tailNumber: '"tailNumber":"UAV-1"'

- name: mission-status
  utterance: "What is the mission status for UAV-1?"
  expectedTools:
    - agent: MissionAgent
      tool: GetMissionStatus
      argsContain:
        tailNumber: '"tailNumber":"UAV-1"'

- name: gdt-link-status
  utterance: "What's the link status for UAV-3?"
  expectedTools:
    - agent: GdtControlAgent
      tool: GetLinkStatus
      argsContain:
        tailNumber: '"tailNumber":"UAV-3"'

- name: gdt-tracking-mode
  utterance: "Set UAV-1's antenna tracking mode to manual"
  expectedTools:
    - agent: GdtControlAgent
      tool: SetAntennaTrackingMode
      argsContain:
        tailNumber: '"tailNumber":"UAV-1"'
        mode: '"mode":"Manual"'

- name: compound-flight-and-payload
  utterance: "fly UAV-1 to target alpha, set speed to 200 and altitude to 3000 and point the camera there"
  expectedTools:
    - agent: FlightControlAgent
      tool: NavigateTo
      argsContain:
        location: '"location":"target alpha"'
    - agent: FlightControlAgent
      tool: SetSpeed
      argsContain:
        speedKts: '"speedKts":200'
    - agent: FlightControlAgent
      tool: SetAltitude
      argsContain:
        altitudeFt: '"altitudeFt":3000'
    - agent: PayloadControlAgent
      tool: PointPayload
      argsContain:
        location: '"location":"target alpha"'

- name: ambiguous-uav-no-tail-number
  utterance: "set speed to 150 knots"
  expectNoToolCalls: true

- name: unit-conversion-resistance
  utterance: "set UAV-1 altitude to 3000"
  expectedTools:
    - agent: FlightControlAgent
      tool: SetAltitude
      argsContain:
        altitudeFt: '"altitudeFt":3000'
