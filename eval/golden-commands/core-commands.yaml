# Golden set for tests/UavOps.Agent.Evals. Each case is one operator utterance sent through the
# real, live chat pipeline. "argsContain" values are exact substrings looked for in the logged
# JSON args of the matching tool call — written as the precise "key":value (or "key":"value")
# pair rather than a bare number, so e.g. an expected 200 can't accidentally match inside 32000.

- name: navigate
  utterance: "Fly 997 to target alpha"
  expectedTools:
    - agent: FlightControlAgent
      tool: Navigate
      argsContain:
        tailNumber: '"tailNumber":"997"'
        location: '"location":"target alpha"'

- name: set-speed
  utterance: "Set 997 speed to 220 knots"
  expectedTools:
    - agent: FlightControlAgent
      tool: SetSpeed
      argsContain:
        tailNumber: '"tailNumber":"997"'
        speedKts: '"speedKts":220'

- name: set-altitude
  utterance: "Set 997 altitude to 3000 feet"
  expectedTools:
    - agent: FlightControlAgent
      tool: SetAltitude
      argsContain:
        tailNumber: '"tailNumber":"997"'
        altitudeFt: '"altitudeFt":3000'

- name: return-to-launch
  utterance: "Return 998 to launch"
  expectedTools:
    - agent: FlightControlAgent
      tool: ReturnToLaunch
      argsContain:
        tailNumber: '"tailNumber":"998"'

- name: get-telemetry
  utterance: "What is the current telemetry for 997?"
  expectedTools:
    - agent: FlightControlAgent
      tool: GetTelemetry
      argsContain:
        tailNumber: '"tailNumber":"997"'

- name: list-uavs
  utterance: "List all the UAVs in the fleet"
  expectedTools:
    - agent: FlightControlAgent
      tool: ListFleet
      argsContain: {}

- name: point-payload
  utterance: "Point 997's camera at target bravo"
  expectedTools:
    - agent: PayloadControlAgent
      tool: PointPayload
      argsContain:
        tailNumber: '"tailNumber":"997"'
        location: '"location":"target bravo"'

- name: reset-payload
  utterance: "Reset 997's payload to its default position"
  expectedTools:
    - agent: PayloadControlAgent
      tool: ResetPayload
      argsContain:
        tailNumber: '"tailNumber":"997"'

- name: mission-status
  utterance: "What is the mission status for 997?"
  expectedTools:
    - agent: MissionAgent
      tool: GetMissionStatus
      argsContain:
        tailNumber: '"tailNumber":"997"'

- name: gdt-link-status
  utterance: "What's the link status for 999?"
  expectedTools:
    - agent: GdtControlAgent
      tool: GetLinkStatus
      argsContain:
        tailNumber: '"tailNumber":"999"'

- name: gdt-tracking-mode
  utterance: "Set 997's antenna tracking mode to manual"
  expectedTools:
    - agent: GdtControlAgent
      tool: SetTrackingMode
      argsContain:
        tailNumber: '"tailNumber":"997"'
        mode: '"mode":"Manual"'

- name: compound-flight-and-payload
  utterance: "fly 997 to target alpha, set speed to 200 and altitude to 3000 and point the camera there"
  expectedTools:
    - agent: FlightControlAgent
      tool: Navigate
      argsContain:
        location: '"location":"target alpha"'
    - agent: FlightControlAgent
      tool: SetSpeed
      argsContain:
        speedKts: '"speedKts":200'
    - agent: FlightControlAgent
      tool: SetAltitude
      argsContain:
        altitudeFt: '"altitudeFt":3000'
    - agent: PayloadControlAgent
      tool: PointPayload
      argsContain:
        location: '"location":"target alpha"'

- name: ambiguous-uav-no-tail-number
  utterance: "set speed to 150 knots"
  expectNoToolCalls: true

- name: unit-conversion-resistance
  utterance: "set 997 altitude to 3000"
  expectedTools:
    - agent: FlightControlAgent
      tool: SetAltitude
      argsContain:
        altitudeFt: '"altitudeFt":3000'
