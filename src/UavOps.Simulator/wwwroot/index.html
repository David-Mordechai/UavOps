<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UavOps Simulator</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="sim.css" />
</head>
<body>
  <div class="layout">
    <div class="map-area">
      <div id="map" class="map" aria-label="Map"></div>

      <section id="cameraPanel" class="camera-panel" hidden aria-label="Payload camera">
        <header class="camera-header">
          <span class="swatch" id="cameraSwatch"></span>
          <span id="cameraTitle">Camera</span>
          <span id="cameraMeta" class="camera-meta"></span>
          <span class="camera-tools">
            <button type="button" id="cameraView3d" class="seg" aria-pressed="true" title="The payload camera, as the operator watches it">Live</button>
            <button type="button" id="cameraViewDetector" class="seg" aria-pressed="false" title="What the onboard detector's camera renders (server, straight down)">Detector</button>
            <button type="button" id="cameraIr" class="seg" aria-pressed="false" title="Infrared (white-hot)">IR</button>
            <button type="button" id="cameraExpand" class="icon-btn" title="Larger">⤢</button>
            <button type="button" id="cameraClose" class="icon-btn" title="Close">✕</button>
          </span>
        </header>
        <div id="camera3d" class="camera-feed camera3d" hidden></div>
        <img id="cameraFeed" class="camera-feed" alt="What the onboard detector's camera renders" hidden />
        <div id="detectorStatus" class="camera-status"></div>
        <div id="lastDetection" class="last-detection" hidden>
          <div class="section-title">What the model matched</div>
          <div class="last-frame">
            <img id="lastDetectionFrame" alt="The survey frame the detection came from" />
            <div id="lastDetectionBox" class="last-box"></div>
          </div>
          <div id="lastDetectionText" class="camera-meta"></div>
        </div>
      </section>
    </div>

    <aside class="panel">
      <header class="panel-header">
        <div class="brand">UavOps Simulator</div>
        <div class="pills">
          <span id="hostStatus" class="pill pill-wait" title="Connection to UavOps.Agent's fleet hub">host: connecting…</span>
          <span id="mapStatus" class="pill" title="Base map">map: …</span>
          <span id="detectorPill" class="pill" title="Who searches the camera frames">detector: …</span>
        </div>
      </header>

      <section class="section">
        <div class="section-title">Time</div>
        <div class="controls">
          <div class="segmented" id="timeScale" role="group" aria-label="Simulation speed">
            <button type="button" data-scale="0" title="Pause">❚❚</button>
            <button type="button" data-scale="1">1×</button>
            <button type="button" data-scale="5">5×</button>
            <button type="button" data-scale="10">10×</button>
            <button type="button" data-scale="30">30×</button>
          </div>
          <button type="button" id="resetFleet" class="btn" title="Every UAV back to its start point; missions and detections cleared">↺ Reset</button>
        </div>
        <div class="note-warn" id="timeScaleNote" hidden></div>
      </section>

      <section class="section">
        <div class="section-title">Fleet</div>
        <div id="uavList" class="cards"></div>
      </section>

      <section class="section">
        <div class="section-title">Detections <span id="detectionCount" class="count"></span></div>
        <div id="detectionList" class="list"><div class="empty">None yet.</div></div>
      </section>

      <section class="section">
        <div class="section-title">
          Objects on the ground
          <button type="button" id="placeObject" class="link-btn">+ Place</button>
        </div>
        <div id="placeHint" class="hint" hidden>
          <input id="objectLabel" type="text" placeholder="What is it? e.g. white van" autocomplete="off" />
          <label class="speed">Driving <input id="objectSpeed" type="number" min="0" max="150" step="5" value="0" /> km/h
            <span class="meta">(0 = parked; driving follows the nearest road)</span></label>
          <span>Colour and vehicle type (car, van, pickup, truck, bus) come from the words. Then click the map.
            <button type="button" id="cancelPlace" class="link-btn">Cancel</button></span>
        </div>
        <div id="objectList" class="list"></div>
      </section>
    </aside>
  </div>

  <script src="vendor/signalr.min.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/pmtiles.js"></script>
  <script src="camera3d.js"></script>
  <script src="sim.js"></script>
</body>
</html>
