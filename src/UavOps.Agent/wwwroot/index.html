<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UavOps.Agent</title>
  <!-- Must run before any stylesheet paints, so an explicit theme choice never flashes the wrong
       palette on load. Kept inline (not an external file) so there's no network round trip before
       it runs; identical copy in graph.html's <head> — keep both in sync. -->
  <script>
    (function () {
      var t = localStorage.getItem("uavops-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <header>
    <div class="brand">UavOps.Agent</div>
    <nav class="tabs" aria-label="Views">
      <a class="tab" href="index.html" aria-current="page">Chat</a>
      <a class="tab" href="graph.html">Agent Graph</a>
    </nav>
    <div class="header-actions">
      <span id="connectionStatus" class="status status-connecting">connecting…</span>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </header>

  <main id="messages">
    <div class="thread" id="thread"></div>
  </main>

  <form id="composer">
    <div id="composer-inner">
      <input id="messageInput" type="text" autocomplete="off" placeholder="Type a command, e.g. &quot;set speed to 120 and point the camera at target alpha&quot;" />
      <button type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5" />
          <polyline points="5 12 12 5 19 12" />
        </svg>
      </button>
    </div>
  </form>

  <script src="lib/signalr.min.js"></script>
  <script src="chat.js"></script>
  <script src="theme.js"></script>
</body>
</html>
