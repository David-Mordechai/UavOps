<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UavOps.Agent — Agent Graph</title>
  <!-- Keep in sync with the identical snippet in index.html's <head> — see its comment. -->
  <script>
    (function () {
      var t = localStorage.getItem("uavops-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="lib/vis-network.min.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="graph.css" />
</head>
<body>
  <header>
    <div class="brand">UavOps.Agent</div>
    <nav class="tabs" aria-label="Views">
      <a class="tab" href="index.html">Chat</a>
      <a class="tab" href="graph.html" aria-current="page">Agent Graph</a>
    </nav>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </header>

  <div id="graph-container"></div>

  <div class="legend">
    <div class="legend-item">
      <span class="legend-swatch legend-root">
        <svg class="legend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3.5c-1.7 0-3 1.3-3 3 0 .3 0 .6.1.9C4.7 8 4 9.1 4 10.3c0 1 .5 1.9 1.2 2.4-.4.6-.7 1.3-.7 2.1 0 1.8 1.4 3.3 3.1 3.4.3 1.3 1.5 2.3 3 2.3.6 0 1.2-.2 1.7-.5"/>
          <path d="M15 3.5c1.7 0 3 1.3 3 3 0 .3 0 .6-.1.9 1.4.6 2.1 1.7 2.1 2.9 0 1-.5 1.9-1.2 2.4.4.6.7 1.3.7 2.1 0 1.8-1.4 3.3-3.1 3.4-.3 1.3-1.5 2.3-3 2.3-.6 0-1.2-.2-1.7-.5"/>
          <path d="M12 3.5v17"/>
        </svg>
      </span>
      Root agent
    </div>
    <div class="legend-item"><span class="legend-swatch legend-agent"></span>Agent</div>
    <div class="legend-item">
      <span class="legend-swatch legend-tool">
        <svg class="legend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </span>
      Tool
    </div>
    <div class="legend-hint">Click a node (▶) to expand its subagents or tools, click again (▼) to collapse. Hover for an example chat utterance.</div>
  </div>

  <script src="lib/vis-network.min.js"></script>
  <script src="graph.js"></script>
  <script src="theme.js"></script>
</body>
</html>
