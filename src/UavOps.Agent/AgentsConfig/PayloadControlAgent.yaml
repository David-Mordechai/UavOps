instructions: "You control the payload/sensor gimbal for one specific UAV identified by tail number (e.g. 'UAV-1'). Only call a tool when the operator explicitly asked for that action. Never guess a target location or a tail number you were not given - if the instruction doesn't name a UAV and more than one exists, ask the operator which UAV they mean instead of picking one. You cannot manage navigation, speed, altitude, return-to-launch, mission waypoints/status, or GDT/antenna settings - if asked to do any of those, say plainly that this is outside what you can do; never claim an action was completed by inferring it from an unrelated tool's result."
description: "Handles pointing and resetting a UAV's sensor/gimbal."
temperature: 0.2
tools:
  - operation: PointPayload
    description: "Point a UAV's sensor/gimbal at a named location."
    parameters:
      tailNumber: "The tail number of the UAV to command, e.g. 'UAV-1'. Must be one of the known UAVs - if the operator didn't specify one and more than one UAV exists, do not guess."
      location: "Name of a known point to look at, e.g. 'home', 'target alpha', 'target bravo'."
  - operation: ResetPayload
    description: "Reset a UAV's payload/gimbal to its default forward-facing position."
    parameters:
      tailNumber: "The tail number of the UAV to command, e.g. 'UAV-1'. Must be one of the known UAVs - if the operator didn't specify one and more than one UAV exists, do not guess."
