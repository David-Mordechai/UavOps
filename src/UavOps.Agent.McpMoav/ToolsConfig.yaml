serverInstructions: |
  Moav domain notes:
  - FlightControlAgent-style tools (Navigate, SetSpeed, SetAltitude, ReturnToLaunch, GetTelemetry,
    ListFleet) vs. MissionAgent-style tools (UploadWaypoints, GetMissionStatus): mission waypoints
    and mission status only belong to the mission tools, never navigation/speed/altitude/return-to-
    launch even though those also end a mission - those are flight tools. Checking mission status is
    NOT the same as confirming a return-to-launch happened - never claim return-to-launch is done
    just because a status check shows no remaining waypoints.
  - PayloadControlAgent-style tools (PointPayload, SetPayloadZoom, ResetPayload) are the sensor/gimbal, distinct from
    GdtControlAgent-style tools (GetLinkStatus, SetTrackingMode), which are the ground-side antenna/
    datalink equipment - GetLinkStatus/SetTrackingMode are placeholder mock tools today.

  AOI search missions:
  - 'Search zone X for Y' / 'enter AOI zone X and search for Y' is PrepareAoiSearch, one call - also
    with several UAVs ('send 998 and 999 to search ZoneA for a red car'): every UAV goes in that
    one call, and the zone is split between them. It only prepares; call StartMission only once
    the operator says to start, and never ask them whether to start.
  - PrepareAoiSearch's tailNumbers is always a list of real tail numbers, never 'ALL' (the 'ALL'
    rules below are for tailNumber only). For 'all UAVs' / 'the whole fleet', call ListFleet and
    list every tail number it returns. No UAV named: call it with an empty list; the tool asks the
    operator which UAV (this replaces asking in text).
  - When the UAV's onboard agent spots the target, the operator gets a message with its location
    automatically; never claim something was found unless such a message said so.

  Mission plans (anything the operator wants done LATER, when something happens):
  - A mission with "when ...", "once ...", "after ...", "then ...", "until ..." (e.g. "Send 997 and
    998 to search and track for a red car in ZoneA, when the car is found return the other UAV
    home and keep tracking the red car") is ONE CreateMissionPlan call with steps; you can't wait
    for the event yourself. A plain "search ZoneA for a red car with 997" is not a plan:
    PrepareAoiSearch.
  - Each step is {when, do, args}. "do" is one of this server's tools that changes something
    (PrepareAoiSearch, StartMission, ReturnToLaunch, StopMission, Navigate, SetSpeed, SetAltitude,
    PointPayload, SetPayloadZoom, ResetPayload...), "args" its normal arguments. "when" is: start;
    after N (step N done); target.found; target.lost; target.regained; target.given_up;
    pass.completed; time N (seconds after start).
  - In a tail number argument you may write {finder} (the UAV that found the target), {others} (the
    plan's other UAVs) or {all} (every UAV the plan names). {finder}/{others} only in a target.*
    step or one after it. Nobody knows in advance which UAV will find the target, so "the other
    UAV(s)" / "the one that found it" are always {others} / {finder}, never a tail number.
  - The example above is: 1. start: PrepareAoiSearch {tailNumbers: ["997","998"], zoneName:
    "ZoneA", targetDescription: "red car", track: true}; 2. after 1: StartMission {tailNumber:
    "{all}"}; 3. target.found: ReturnToLaunch {tailNumber: "{others}"}. (Tracking needs no step:
    track true keeps the finder on it.)
  - Show the operator the steps the tool returns; when they say start, StartMissionPlan - never
    StartMission for a plan, and never run the steps' tools yourself.

  Tail numbers:
  - Never guess a target location or a tail number you were not given. If you don't already know the
    fleet's real tail numbers this turn, call ListFleet first; if a command doesn't name a UAV and
    more than one exists, ask the operator which UAV they mean instead of picking one.
  - A message that simply doesn't name a UAV is NOT the same as one that refers to every UAV. Pass
    'ALL' for tailNumber (see each tool's own parameter description) when the request contains a word
    like 'all', 'every', 'each', 'both', or 'the fleet' - AND also when it uses a plural pronoun
    ('them', 'they', 'their') that refers back to the whole fleet from earlier in the conversation
    (e.g. after you already listed all known UAVs, 'fly them to alpha' means every UAV you just
    listed, not one unspecified UAV) - otherwise ask, don't assume. A plural pronoun with no fleet
    context established yet, or a singular pronoun ('it', 'that one'), still means ask. Once you've
    recognized this as every UAV, call every implied tool for real, this same turn, with
    tailNumber='ALL' - never respond with plain text saying it wasn't executed due to missing UAV
    specification or a timing issue, and never ask the operator to confirm which UAVs are meant; you
    already know, from the fleet you just listed.
  - A bare plural pronoun ('them', 'their', 'theirs', 'they') in a SEPARATE LATER turn, following a
    fleet-wide action you already took earlier in the conversation, still refers to every UAV that
    earlier action covered - regardless of whether that EARLIER turn's own wording used 'all'/
    'every' or was itself just a bare plural pronoun resolved from an already-listed fleet (e.g.
    'fly them to alpha' with no 'all' still counts as the fleet-wide action a later 'point their
    payloads there' refers back to - the earlier turn not saying 'all' does not make the later
    pronoun any less fleet-wide). E.g. you already sent every known UAV somewhere, and a later message
    says only 'point their payloads there' with no 'all'/'every' word of its own. It still needs a
    real tool call this turn for every one of those UAVs - never skip the call, and never report it
    done without calling it. For THIS specific case - a later turn, not the same turn the fleet-wide
    action started in - pass the real tail numbers the earlier action targeted as ONE comma-separated
    tailNumber value (e.g. '997,998,999', the same known values from that earlier action or from
    ListFleet), never the word 'ALL', and never one call per UAV. Do this directly, in the same turn -
    never respond with plain text asking the operator to confirm which UAVs are meant, or saying it
    wasn't executed because the UAV wasn't specified; you already know which UAVs from the earlier
    action, so there is nothing left to ask.
  - A request naming a SPECIFIC SUBSET of more than one UAV that is NOT every UAV (e.g. 'the rest',
    'the other two', 'the remaining ones', or naming several tail numbers directly) must be passed as
    ONE comma-separated tailNumber value (e.g. '998,999'), never as several separate tool calls -
    you have been unreliable at remembering to make every follow-up call a multi-UAV request needs
    when done one call at a time.
  - Copy the operator's numbers exactly as given; never add, guess, or convert a unit (feet, meters,
    knots) they didn't state - the tools already know the correct unit.
  - Never add your own framing about checking or confirming with the operator first, even for a
    fleet-wide action (e.g. call the tool for 'fly all of them to target alpha' directly - never ask
    "should I confirm the full list of affected UAVs first?" in plain text instead of calling
    anything). A tool that genuinely requires operator approval prompts for it automatically, at the
    tool-call level, the moment you call it - asking about it yourself in prose instead of calling
    the tool means nothing happens at all.
  - A single request naming several distinct actions for the same UAV(s) (e.g. 'fly it to alpha at
    speed 200 and altitude 3000', or additionally pointing its payload) needs a real tool call for
    EVERY one of those actions this same turn - Navigate, SetSpeed, SetAltitude, and PointPayload
    are each independent, none of them require operator confirmation, and there is never a genuine
    reason to call only the first one and report the rest as skipped, pending, or blocked by
    confirmation or non-response - if you did not call it, it did not happen, and claiming otherwise
    is a fabrication regardless of how the excuse is phrased.
tools:
  - operation: ListFleet
    # The "always call this fresh" reinforcement below was DELETED, not just trimmed - unlike
    # tailNumber, this exact rule (with worked examples, including this very tool) is already
    # stated in full in BrainAgent.yaml's own "Resolving references from history" section, and
    # RepeatedFleetQueryLiveTests directly tests the scenario this reinforcement existed for
    # (asking "What UAVs do we have?" again after fleet state changed) - re-verified 8/8 with the
    # sentence gone, so it was pure duplication here. GetTelemetry/GetLinkStatus/GetMissionStatus
    # below, and the equivalent tools in McpWatchdog/McpSimulator, keep their own copy of this
    # sentence for now - no dedicated live test exercises the same "ask twice, verify a fresh
    # call happens" property for those specific tools, so per this skill's own rule (never trim
    # without per-tool evidence), they're left alone until one exists.
    description: >-
      List all known UAVs by tail number with a brief status summary for each. Use this to find
      out which UAVs exist, or to help resolve an ambiguous or unnamed UAV.
    readOnly: true

  - operation: GetTelemetry
    # "Always call this fresh" deleted, same evidence-based basis as ListFleet above - covered
    # once in BrainAgent.yaml, and RemainingFreshnessReinforcementLiveTests directly tests this
    # exact tool's "ask, mutate, ask again" scenario - verified 8/8 with the sentence gone.
    description: >-
      Get a UAV's current position, speed, altitude, and mode.
    readOnly: true
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.

  - operation: Navigate
    description: >-
      Send a UAV to fly to a named location as an ordinary waypoint - it keeps flying/orbiting
      there, it does not land. Do NOT use this for a 'bring/send it home', 'return to base', or
      'return to launch' request, even though 'home' is a valid location name for this tool -
      phrasing like that means the operator wants the UAV to land back at base, which is
      ReturnToLaunch, not a flight to the 'home' coordinate.
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.
      location: >-
        Name of a known point, e.g. 'home', 'alpha', 'bravo'. If the operator says 'target
        alpha'/'target bravo', either that full phrase or just 'alpha'/'bravo' is fine - use
        whichever the operator's own wording makes natural. Note 'home' here is only for a
        genuine fly-to-that-point request - a 'bring/send it home' style request is
        ReturnToLaunch instead, not this tool with location='home'.

  - operation: SetSpeed
    description: "Change a UAV's target cruise speed."
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.
      speedKts: >-
        Target speed in knots. Integer, 1-500. This is always knots - never convert the number
        from or to mph, km/h, or m/s; use the number exactly as stated.

  - operation: SetAltitude
    description: "Change a UAV's target altitude."
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.
      altitudeFt: >-
        Target altitude in feet above mean sea level (MSL). Integer, 0-60000. This is always
        feet - never convert the number from or to meters; use the number exactly as stated,
        even if surrounding text mentions another unit.

  - operation: ReturnToLaunch
    description: >-
      Command a UAV to return to and land at its launch point (RTL) - this is what phrasing like
      'bring it home', 'send it home', 'back to base', and 'return to launch' actually means,
      even when the operator's exact word is 'home' or 'base' rather than 'launch point'. Use
      this, not Navigate, for any of that phrasing - Navigate would only fly to the 'home'
      coordinate as an ordinary waypoint without landing, which is not what a 'bring it home'
      request means.
    destructive: false
    parameters:
      # Only the subset-resolution sentence below is kept inline (not just in serverInstructions,
      # like every other tool in this file) - the rest of the tailNumber logic (ALL, pronouns,
      # unnamed UAV) is fully covered once in serverInstructions and deliberately NOT restated
      # here, since duplicating it added tokens on every offered turn without adding reliability.
      # This one sentence stays: CLAUDE.md documents a real production incident on this exact
      # tool/phrasing ("bring the rest of the fleet home" - see ReturnRemainingFleetLiveTests),
      # live-reproduced again this session - omitting it here (relying on serverInstructions
      # alone) measurably dropped this tool to 7/8 while every other tool held 8/8, because the
      # model needs this specific reinforcement physically next to the parameter it's filling in,
      # not just present somewhere earlier in the system prompt. Don't remove without re-running
      # ReturnRemainingFleetLiveTests/FullShiftScenarioLiveTests at full repeat count first.
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one. If the request refers to a SPECIFIC SUBSET of more than one UAV (e.g. 'the
        rest', 'the other two', or naming several tail numbers), work out the real tail numbers
        yourself (call ListFleet first if needed) and pass them together as one comma-separated
        value, e.g. '998,999' - never split this into separate tool calls, one per UAV.

  - operation: PointPayload
    description: "Point a UAV's sensor/gimbal at a named location."
    destructive: false
    parameters:
      # RESOLVED WITHOUT PROMPT TEXT (2026-09-27: PointPayloadFollowUpLiveTests 8/8,
      # FlyAllFleetWideLiveTests 8/8, both unchanged here - the host's fleet-group memory for
      # plural follow-ups fixed it deterministically). History, and why not to add text here:
      # PointPayloadFollowUpLiveTests/MultiTurnFleetOpsLiveTests reproduced a
      # cross-turn fabrication bug - a fleet-wide command ("fly them all to alpha") followed, in
      # a SEPARATE later turn, by a pronoun-only follow-up ("point their payloads there") often
      # fails to resolve to every UAV. Adding inline ALL/pronoun reinforcement here measurably
      # improved that (verified), but also measurably destabilized the unrelated same-turn
      # FlyAllFleetWideLiveTests compound-command scenario (Navigate+SetSpeed+SetAltitude+
      # PointPayload together), causing a real partial-fleet-mutation case that scenario never
      # produced before. Every prompt-text variant tried traded one scenario's reliability for
      # the other's - this looks like a genuine model-capacity limit, not a wording problem, and
      # is left as bare identity (this file's established working baseline) rather than risk a
      # regression on the safety-critical compound-command path. Do not "fix" this again with
      # more parameter text without re-running BOTH PointPayloadFollowUpLiveTests AND
      # FlyAllFleetWideLiveTests at full repeat count and confirming neither regresses.
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.
      location: >-
        Name of a known point to look at, e.g. 'home', 'alpha', 'bravo'. If the operator says
        'target alpha'/'target bravo', either that full phrase or just 'alpha'/'bravo' is fine -
        use whichever the operator's own wording makes natural.

  - operation: ResetPayload
    description: "Reset a UAV's payload/gimbal to its default forward-facing position."
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.

  # SetPayloadZoom is the only way the payload camera's zoom changes: PointPayload only aims it,
  # and the simulator never zooms on its own. PrepareAoiSearch sets the search zoom itself, through
  # the same command.
  - operation: SetPayloadZoom
    description: >-
      Zoom a UAV's payload camera in or out. Use for 'zoom in', 'zoom 997 to 10x', 'zoom out'. It
      does not change where the camera points - use PointPayload for that - and never changes the
      UAV's altitude.
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.
      zoom: >-
        Zoom factor: 1 is the widest view, larger is closer (the payload clamps to its own maximum,
        and the result says what it took). For 'zoom in'/'zoom out' without a number, take the
        current zoom from GetTelemetry and double or halve it.

  - operation: GetLinkStatus
    # "Always call this fresh" deleted, same evidence-based basis as GetTelemetry above -
    # RemainingFreshnessReinforcementLiveTests directly tests this tool's own "ask, mutate, ask
    # again" scenario - verified 8/8 with the sentence gone.
    description: >-
      Get the ground data terminal's link status for a UAV: signal strength, link state, and
      antenna tracking mode.
    readOnly: true
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.

  - operation: SetTrackingMode
    description: >-
      Set the ground data terminal antenna's tracking mode for a UAV (the datalink antenna
      following the UAV). Not for tracking or following a target on the ground - that's
      PrepareAoiSearch or SetSearchTarget with track true.
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.
      mode: >-
        Either 'Auto' (antenna automatically tracks the UAV) or 'Manual' (antenna position is
        fixed/manually controlled). Use the operator's exact intent - do not default to one or
        the other.

  - operation: UploadWaypoints
    description: "Upload a list of mission waypoints for a UAV to fly in order."
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.
      waypoints: >-
        Array of waypoints to fly in order, each with lat (decimal degrees), lng (decimal
        degrees), and altitudeFt (feet MSL).

  - operation: GetMissionStatus
    # "Always call this fresh" deleted, same evidence-based basis as GetTelemetry above -
    # RemainingFreshnessReinforcementLiveTests directly tests this tool's own "ask, mutate, ask
    # again" scenario - verified 8/8 with the sentence gone.
    description: >-
      Get a UAV's current mission execution status and remaining waypoint count.
    readOnly: true
    parameters:
      tailNumber: >-
        The tail number of the UAV to command, e.g. '997'. Must be one of the known UAVs - never
        guess one.

  # ----- AOI search missions -----
  # PrepareAoiSearch exists because a four-step dependent chain (plan, upload, set target, then
  # ask to start) is the worst case for this model: in live testing it reliably makes the first
  # call of a multi-call request and drops the rest (6/8 failures on "bring the rest home"). The
  # granular tools below stay for piecemeal requests ("tell 997 to look for a red car").
  # tailNumber is single-UAV on every other mission tool: an 'ALL' fan-out would send the same
  # route over the same zone to every UAV. PrepareAoiSearch instead takes tailNumbers, a JSON
  # array the host grounds and passes through in ONE call (TailNumbersGroundingTool, no fan-out),
  # so McpMoav can split the zone between them. Zone parameters are named zoneName, never location, so
  # LocationCanonicalizationTool (keyed on a 'location' property) leaves them alone.
  # The operator's own "start the mission" is the one approval: StartMission is not destructive
  # (no ConfirmationGate prompt) and the model never asks "Start the mission?" either. Having both
  # a question and a gate prompt meant approving twice. "Tell the operator the search is ready" is
  # only in PrepareAoiSearch's result (nextStep), never here: phrased here, the model replied
  # "Search prepared... ready to start on command" without calling the tool (2/8 live).

  - operation: PrepareAoiSearch
    description: >-
      Prepare one or more UAVs to search a named AOI zone for something: plans search routes
      covering the zone (split between the UAVs when there are several, so each searches its own
      part), zooms each UAV's payload camera and sets its search speed, uploads each route, and
      tells each UAV's onboard agent what to look for. Each UAV keeps its current altitude. Once started, a
      search goes over the zone again and again (a moving target may not be there on one pass)
      until the operator stops it (StopMission) or sends the UAV elsewhere. Use for requests
      like 'enter AOI zone ZoneA and search for a white van', 'search zone B for a red car', or
      'send 998 and 999 to search ZoneA for a red car'. It does NOT start flying; StartMission
      does that, only once the operator says to start - never ask whether to start. 'Enter a zone'
      or 'send UAVs to search a zone' means this tool - do not use Navigate for a zone name;
      Navigate only flies to a known point like 'alpha'.
    destructive: false
    parameters:
      # "Call it now even if no UAV was named": the operator's usual phrasing names no UAV, and
      # retrieval doesn't offer ListFleet for it (nothing in "Enter AOI zone ZoneA and search for
      # white van" is about UAVs). Live-reproduced 2/8 under load: the model said "first, let me
      # check which UAVs are available", had no ListFleet to call, and ended the turn with nothing
      # prepared. With a list, "call it with any UAV you know" stopped working (the model asked
      # "Which UAV?" in text, AoiSearchMissionLiveTests 6/8 alone), so an empty list now means
      # "not named": the host asks the operator which UAV (TailNumbersGroundingTool).
      # A list, not a comma-separated string, and never 'ALL' (operator's decision, 2026-09-29):
      # the model works out which UAVs were meant (ListFleet for 'all'); the host only checks the
      # list against the fleet and the operator's words (TailNumbersGroundingTool).
      tailNumbers: >-
        The UAVs to search with, as a list of real tail numbers: ['997'] for one UAV,
        ['998', '999'] for several - all in this ONE call, never one call per UAV. If the operator
        didn't name any UAV, call this tool right away with an empty list []: the operator is then
        asked which UAV to use - don't ask in text or list the fleet first. Never 'ALL': for
        'all UAVs' call ListFleet and list them.
      zoneName: >-
        Name of the AOI zone to search, as the operator said it, e.g. 'ZoneA'. Call ListAoiZones
        if you need the valid names.
      targetDescription: >-
        What to look for, in the operator's own words, e.g. 'white van'. This is the object to
        find, not a location.
      track: >-
        true when the operator wants the target tracked or followed once found ('search ZoneA for
        a red car and track it', 'find the white van and follow it'): the UAV then locks its
        camera on it, follows it and keeps reporting where it is. false (the default) for a plain
        search.

  - operation: StartMission
    description: >-
      Start a UAV flying the search route already uploaded to it (by PrepareAoiSearch or
      UploadRoute) - what 'start the mission', 'go', or 'begin the search' means after a search
      was prepared. If a mission plan was created (CreateMissionPlan), use StartMissionPlan
      instead. Not for the training simulator or its lessons, and not for watchdog services.
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV whose mission to start, e.g. '997'. Must be one of the known
        UAVs - never guess one.

  - operation: CreateMissionPlan
    description: >-
      Turn an operator's mission into steps that run by themselves later, as things happen - for
      any mission with 'when', 'once', 'after', 'then' or 'until' (e.g. 'search ZoneA for a red car
      with 997 and 998, when it's found send the other one home'). Checks every step, nothing runs
      yet; returns the steps in plain words to show the operator. Not for a plain search or a
      single command - call those tools directly.
    destructive: false
    parameters:
      steps: >-
        The steps in order, each {when, do, args}: 'when' is start, after N, target.found,
        target.lost, target.regained, target.given_up, pass.completed or time N (seconds); 'do' is
        the tool to run; 'args' its arguments, where a tail number can be {finder}, {others} or
        {all}. See the server notes for a full example.

  - operation: StartMissionPlan
    description: >-
      Start a mission plan made by CreateMissionPlan - what 'start', 'go' or 'start the mission'
      means once a plan was shown to the operator. Its steps then run by themselves. Use this, not
      StartMission, whenever a plan was created.
    destructive: false
    parameters:
      planId: >-
        The plan's id from CreateMissionPlan (e.g. 'P1'); leave it out for the latest plan.

  - operation: GetMissionPlan
    description: >-
      Show a mission plan's steps and which have run, are waiting or failed - for 'what is the
      mission doing?', 'which steps are left?'.
    readOnly: true
    parameters:
      planId: >-
        The plan's id (e.g. 'P1'); leave it out for the latest plan.

  - operation: CancelMissionPlan
    description: >-
      Cancel a mission plan's remaining steps ('cancel the plan', 'forget the plan'). The UAVs keep
      doing what they are doing; to stop a UAV use StopMission, to bring it home ReturnToLaunch.
    destructive: false
    parameters:
      planId: >-
        The plan's id (e.g. 'P1'); leave it out for the latest plan.

  - operation: StopMission
    description: >-
      Stop a UAV's search or tracking mission: 'stop the search', 'stop searching', 'stop
      tracking', 'cancel the mission'. The UAV stops where it is and circles, and its payload goes
      back to straight down. A search keeps repeating until this is called. Not for 'come home'
      (ReturnToLaunch) or 'go to <place>' (Navigate) - those end the mission by themselves.
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV whose mission to stop, e.g. '997'. Must be one of the known
        UAVs - never guess one.

  - operation: ListAoiZones
    description: >-
      List the named AOI (area of interest) zones that can be searched, with each zone's area and
      centre point.
    readOnly: true

  - operation: GetAoiZone
    description: >-
      Get details of one AOI zone: its area, centre point, and bounds. Only for questions about a
      zone; searching a zone does not need this first.
    readOnly: true
    parameters:
      zoneName: >-
        Name of the AOI zone, e.g. 'ZoneA'.

  - operation: PlanSearchRoute
    description: >-
      Plan a search route over an AOI zone for one UAV, without uploading it or setting what to
      look for. Only when the operator asks just to plan; for 'search zone X for Y' use
      PrepareAoiSearch instead.
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the ONE UAV the route is for, e.g. '997'. Must be one of the known UAVs
        - never guess one, and never 'ALL' or several UAVs.
      zoneName: >-
        Name of the AOI zone to cover, e.g. 'ZoneA'.
      altitudeFt: >-
        Search altitude in feet, only if the operator stated one; leave it out otherwise, and the
        route is flown at the UAV's current altitude. Never convert from meters.

  - operation: UploadRoute
    description: >-
      Upload a UAV's most recently planned search route to it. Does not start flying. Use this
      after PlanSearchRoute; use UploadWaypoints instead only when the operator gives explicit
      coordinates.
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV whose planned route to upload, e.g. '997'. Must be one of the
        known UAVs - never guess one.

  - operation: SetSearchTarget
    description: >-
      Tell a UAV's onboard agent what to look for, e.g. 'tell 997 to look for a red car'. When it
      spots it, the operator is told where automatically. Only this one step; for 'search zone X
      for Y' use PrepareAoiSearch instead.
    destructive: false
    parameters:
      tailNumber: >-
        The tail number of the UAV to set the search target on, e.g. '997'. Must be one of the
        known UAVs - never guess one.
      targetDescription: >-
        What to look for, in the operator's own words, e.g. 'red car'. This is the object to find,
        not a location like 'target alpha'.
      track: >-
        true when the operator wants the target tracked or followed once found; the UAV then
        locks its camera on it and follows it. false (the default) to only report it.
